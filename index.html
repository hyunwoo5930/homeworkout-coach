<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>HOME PT</title>

<style>

:root{

--bg:#101319;

--card:#1B222C;

--card2:#242D38;

--text:#F5F7FA;

--sub:#9FAAB8;

--accent:#B7F36B;

--danger:#FF6E5B;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,
sans-serif;
}

body{

background:var(--bg);

color:var(--text);

}

.page{

display:none;

max-width:430px;

min-height:100vh;

margin:auto;

padding:20px;

padding-bottom:130px;

}

.page.active{

display:block;

}

.logo{

font-size:34px;

font-weight:800;

margin-top:10px;

}

.logo span{

color:var(--accent);

}

.headline{

margin-top:35px;

}

.headline h1{

font-size:38px;

line-height:1.15;

}

.stats{

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

margin-top:25px;

}

.stat{

background:var(--card);

border-radius:20px;

padding:20px;

}

.stat-title{

font-size:13px;

color:var(--sub);

}

.stat-value{

font-size:28px;

font-weight:700;

margin-top:5px;

}

.section-title{

font-size:24px;

font-weight:700;

margin-top:30px;

margin-bottom:12px;

}

.card{

background:var(--card);

border-radius:20px;

padding:16px;

margin-bottom:12px;

}

.exercise-item{

height:72px;

background:var(--card2);

border-radius:18px;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 15px;

margin-bottom:10px;

}

.exercise-left{

display:flex;

align-items:center;

gap:12px;

}

.exercise-icon{

width:44px;

height:44px;

border-radius:12px;

background:#384556;

display:flex;

align-items:center;

justify-content:center;

font-size:12px;

font-weight:700;

}

.exercise-name{

font-size:18px;

font-weight:600;

}

.add-btn{

height:60px;

border-radius:18px;

border:2px dashed #445161;

display:flex;

align-items:center;

justify-content:center;

color:var(--sub);

cursor:pointer;

}

.button{

width:100%;

height:62px;

border:none;

border-radius:18px;

background:var(--accent);

font-size:20px;

font-weight:800;

color:#111;

cursor:pointer;

}

.control-grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

margin-top:15px;

}

.control-card{

background:var(--card);

border-radius:18px;

padding:16px;

}

.control-label{

font-size:13px;

color:var(--sub);

}

.control-value{

font-size:26px;

font-weight:700;

margin-top:4px;

}


.bottom-nav{

position:fixed;

left:0;

right:0;

bottom:0;

background:#17202A;

border-top:1px solid #293343;

display:flex;

justify-content:space-around;

padding:12px 0 24px;

}

.nav{

text-align:center;

color:var(--sub);

cursor:pointer;

}

.nav.active{

color:var(--accent);

}

.nav-icon{

font-size:22px;

}

.nav-text{

font-size:12px;

margin-top:4px;

}

.modal{

position:fixed;

inset:0;

background:rgba(0,0,0,.75);

display:none;

align-items:center;

justify-content:center;

padding:20px;

}

.modal.show{

display:flex;

}

.modal-content{

width:100%;

max-width:430px;

background:var(--card);

border-radius:24px;

padding:20px;

max-height:90vh;

overflow:auto;

}

.input{

width:100%;

padding:14px;

border-radius:14px;

border:1px solid #334050;

background:#121821;

color:white;

margin-top:6px;

margin-bottom:12px;

}

.label{

font-size:13px;

color:var(--sub);

}

.close{

float:right;

cursor:pointer;

font-size:20px;

}

</style>

</head>

<body>

<section
id="homePage"
class="page active">

<div class="logo">
HOME <span>PT</span>
</div>

<div class="headline">

<h1>

오늘도,<br>
나를 위한 시간

</h1>

</div>

<div class="stats">

<div class="stat">

<div class="stat-title">
연속 운동
</div>

<div class="stat-value">
5일
</div>

</div>

<div class="stat">

<div class="stat-title">
이번 달
</div>

<div class="stat-value">
12일
</div>

</div>

</div>

<div class="section-title">
오늘의 루틴
</div>

<div class="card">

<div id="exerciseList">

<div
class="exercise-item">

<div
class="exercise-left">

<div
class="exercise-icon">
SQ
</div>

<div
class="exercise-name">
스쿼트
</div>

</div>

</div>

</div>

<div
class="add-btn"
onclick="openModal()">

➕ 운동 추가

</div>

</div>

<div class="control-grid">

<div class="control-card">

<div class="control-label">
세트 수
</div>

<div class="control-value">
3
</div>

</div>

<div class="control-card">

<div class="control-label">
챌린지
</div>

<div class="control-value">
30%
</div>

</div>

</div>

<br>

<button class="button">

운동 시작

</button>

</section>


<div
id="exerciseModal"
class="modal">

<div class="modal-content">

<div
class="close"
onclick="closeModal()">

✕

</div>

<h2>
운동 추가
</h2>

<br>

<div class="label">
운동명
</div>

<input
id="exerciseName"
class="input"
placeholder="예) 턱걸이">

<div class="label">
카테고리
</div>

<select
id="exerciseCategory"
class="input">

<option>하체</option>
<option>상체</option>
<option>코어</option>
<option>유산소</option>

</select>

<div class="label">
설명
</div>

<textarea
id="exerciseDescription"
class="input"
rows="4"></textarea>

<button
class="button"
onclick="saveExercise()">

추가하기

</button>

</div>

</div>

<div class="bottom-nav">

<div class="nav active">

<div class="nav-icon">
🏠
</div>

<div class="nav-text">
홈
</div>

</div>

<div class="nav">

<div class="nav-icon">
💪
</div>

<div class="nav-text">
운동관리
</div>

</div>

<div class="nav">

<div class="nav-icon">
📅
</div>

<div class="nav-text">
기록
</div>

</div>

</div>


<script>

const exercises = [
{
name:"스쿼트",
category:"하체"
}
];

function openModal(){

document
.getElementById(
"exerciseModal"
)
.classList.add(
"show"
);

}

function closeModal(){

document
.getElementById(
"exerciseModal"
)
.classList.remove(
"show"
);

}

function saveExercise(){

const name =
document
.getElementById(
"exerciseName"
)
.value;

if(!name){

alert("운동명을 입력하세요.");

return;
}

const category =
document
.getElementById(
"exerciseCategory"
)
.value;

exercises.push({

name,
category

});

renderExercises();

closeModal();

document
.getElementById(
"exerciseName"
)
.value="";

document
.getElementById(
"exerciseDescription"
)
.value="";

}

function renderExercises(){

const list =
document
.getElementById(
"exerciseList"
);

list.innerHTML="";

exercises.forEach(ex=>{

list.innerHTML += `

<div class="exercise-item">

<div class="exercise-left">

<div class="exercise-icon">

${ex.name.substring(0,2)}

</div>

<div class="exercise-name">

${ex.name}

</div>

</div>

</div>

`;

});

}

renderExercises();

</script>

</body>
</html>
